
spring.application.name=gestion-utilisateur

server.port=8088
spring.config.import=optional:configserver:http://localhost:8099
 
spring.datasource.url=jdbc:mysql://localhost:3307/gestion_utilisateur?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Keycloak Admin API (surchargeable via env var)
keycloak.url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:money-minder}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.default-role=${KEYCLOAK_DEFAULT_ROLE:USER}